<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>AIGC 热点雷达</title>
<meta name="description" content="每天汇总抖音 / B站 AIGC 爆款、热梗热搜、抖音热门挑战、热歌飙升和 AI 圈大事件，每条附「为什么能火」的分析和 AI 选题建议">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2315171c'/%3E%3Cpath d='M16 16 L16 2 A14 14 0 0 1 29 11 Z' fill='%23ffe14d'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23ffffff' stroke-opacity='.35' stroke-width='1.5'/%3E%3Ccircle cx='22' cy='9' r='2.2' fill='%23ff3b30'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/big-shoulders-display-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="mast">
  <div class="wrap mast-in">
    <div class="brand">
      <span class="radar" aria-hidden="true"><i></i></span>
      <div class="brand-text">
        <h1>AIGC 热点雷达</h1>
        <p class="dateline" id="updated">正在读取最新一次扫描…</p>
      </div>
    </div>
    <div class="mast-side">
      <p class="scope">扫描 <b>抖音</b> <b>B站</b> <b>微博</b> <b>QQ音乐</b> <b>网易云</b> 和十几家 AI 媒体<br>每 3 小时一次，每条热点都附 AI 写的「为什么能火」</p>
      <button class="arch" data-arch>往期日报 · 按日期查 →</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="picks" class="picks" aria-label="今日选题"></section>

  <div class="bar" id="bar">
    <nav class="tabs" id="tabs" role="tablist" aria-label="分类">
      <button data-tab="douyin" class="on">抖音热点</button>
      <button data-tab="bilibili">B站热点</button>
      <button data-tab="trend">热梗热搜</button>
      <button data-tab="music">热歌飙升</button>
      <button data-tab="news">AI 大事件</button>
    </nav>
    <div class="seg" id="win" role="tablist" aria-label="时间范围">
      <button data-w="1" class="on"><b>24</b>小时</button>
      <button data-w="3"><b>3</b>天</button>
      <button data-w="7"><b>7</b>天</button>
      <button data-w="30"><b>30</b>天</button>
      <button data-arch>往期</button>
    </div>
    <div class="days" id="days" role="tablist" aria-label="选择日期" hidden></div>
  </div>

  <div class="subnav" id="subnav" role="tablist" aria-label="二级分类"></div>
  <p class="lede" id="lede"></p>

  <div class="tools">
    <div class="chips sub" id="chips"></div>
    <div class="search">
      <input id="q" type="search" placeholder="在当前分类里搜：标题、作者、分析…" autocomplete="off" aria-label="搜索">
      <select id="sort" aria-label="排序"></select>
    </div>
  </div>

  <div id="list" class="list"></div>
</main>

<footer class="foot wrap">
  <details>
    <summary>数据源状态</summary>
    <div id="status"></div>
  </details>
  <p>热搜和爆款约每 3 小时扫描一次，AI 选题每天早上更新。抖音视频来自抖音热榜话题和抖音热点宝视频热榜（经 TikHub），只收官方标了 AI 的；热度按累计点赞，播放是热点宝给的近 N 天播放。抖音、B站音乐榜是周榜。「往期」可以查最近 30 天每一天的完整数据和当天早报原文。小红书暂未接入。标「推测」的分析是 AI 根据有限信息做的判断。</p>
</footer>

<script src="app.js"></script>
</body>
</html>
